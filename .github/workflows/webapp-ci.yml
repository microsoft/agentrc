name: Webapp CI

on:
  push:
    branches-ignore: [main]
    paths:
      - "webapp/**"
      - "packages/core/**"
      - "Dockerfile.webapp"
      - "infra/webapp/**"
  pull_request:
    branches: [main]
    paths:
      - "webapp/**"
      - "packages/core/**"
      - "Dockerfile.webapp"
      - "infra/webapp/**"

concurrency:
  group: webapp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/backend/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: cd webapp/backend && npm ci
      - name: Run tests
        run: cd webapp/backend && npm test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd webapp/frontend && npm ci
      - name: Run tests
        run: cd webapp/frontend && npm test

  build-and-scan:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build Docker image
        run: docker build -f Dockerfile.webapp -t agentrc-webapp:test .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentrc-webapp:test
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        with:
          sarif_file: trivy-results.sarif
